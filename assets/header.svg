<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" font-family="JetBrains Mono, Cascadia Code, Menlo, Consolas, monospace">
  <defs>
    <style>
      .ascii   { font-size: 14px; fill: #2ee66e; white-space: pre; }
      .prompt  { font-size: 13px; fill: #58a6ff; }
      .at      { font-size: 13px; fill: #c9d1d9; }
      .host    { font-size: 13px; fill: #f78166; }
      .cmd     { font-size: 13px; fill: #e6edf3; }
      .title   { font-size: 12px; fill: #8b949e; }
    </style>
    <clipPath id="reveal">
      <rect x="160" y="62" width="0" height="120">
        <animate attributeName="width" values="0;440;440" keyTimes="0;0.35;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- terminal window -->
  <rect x="0.5" y="0.5" width="759" height="219" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- title bar -->
  <path d="M0 10 Q0 0 10 0 L750 0 Q760 0 760 10 L760 32 L0 32 Z" fill="#161b22"/>
  <line x1="0" y1="32" x2="760" y2="32" stroke="#30363d" stroke-width="1"/>

  <!-- mac traffic lights -->
  <circle cx="20" cy="16" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="16" r="6" fill="#27c93f"/>

  <!-- title text -->
  <text x="380" y="20" text-anchor="middle" class="title">— oleglog@github: ~ —</text>

  <!-- first prompt -->
  <text x="20" y="56">
    <tspan class="prompt">oleglog</tspan><tspan class="at">@</tspan><tspan class="host">github</tspan><tspan class="at">:</tspan><tspan class="prompt">~</tspan><tspan class="at">$ </tspan><tspan class="cmd">figlet Oleglog</tspan>
  </text>

  <!-- ASCII art revealed left-to-right, looping -->
  <g clip-path="url(#reveal)">
    <text x="160" y="80"  class="ascii" xml:space="preserve">  ___  _            _</text>
    <text x="160" y="98"  class="ascii" xml:space="preserve"> / _ \| | ___  __ _| | ___   __ _</text>
    <text x="160" y="116" class="ascii" xml:space="preserve">| | | | |/ _ \/ _` | |/ _ \ / _` |</text>
    <text x="160" y="134" class="ascii" xml:space="preserve">| |_| | |  __/ (_| | | (_) | (_| |</text>
    <text x="160" y="152" class="ascii" xml:space="preserve"> \___/|_|\___|\__, |_|\___/ \__, |</text>
    <text x="160" y="170" class="ascii" xml:space="preserve">              |___/         |___/</text>
  </g>

  <!-- second prompt with blinking cursor (always visible) -->
  <text x="20" y="200">
    <tspan class="prompt">oleglog</tspan><tspan class="at">@</tspan><tspan class="host">github</tspan><tspan class="at">:</tspan><tspan class="prompt">~</tspan><tspan class="at">$</tspan>
  </text>
  <rect x="155" y="190" width="8" height="13" fill="#2ee66e">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
